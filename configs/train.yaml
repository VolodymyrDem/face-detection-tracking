# Face detector training (ultralytics YOLO) on WIDER FACE.
# Every key under `train` is passed to ultralytics `model.train(...)`:
# https://docs.ultralytics.com/modes/train/#train-settings

model: yolo26n.pt            # COCO-pretrained starting weights, downloaded automatically

train:
  data: /tmp/wider_yolo/data.yaml   # written by scripts/prepare_wider_face.py (not saved to output)
  epochs: 100
  patience: 20               # stop early if val mAP does not improve for 20 epochs
  imgsz: 640                 # WIDER FACE has many tiny faces, so train at full 640
  batch: 32
  workers: 4                 # Kaggle notebooks have 4 CPU cores
  optimizer: auto
  cos_lr: true
  close_mosaic: 10           # turn mosaic augmentation off for the last 10 epochs
  fliplr: 0.5
  project: /kaggle/working/runs
  name: yolo26n_wider_face
  exist_ok: true
  save_period: 5             # also keep a checkpoint every 5 epochs
  plots: true
  seed: 42
